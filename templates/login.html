{% extends 'base.html' %}{% block content %}
<section class="card login"><span class="eyebrow">WELCOME BACK</span><h2>Sign in</h2><p class="muted">Manage your membership and book your next gym session.</p>
<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Username<input name="username" required autocomplete="username" maxlength="30" value="{{ request.form.get('username','') }}"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="wide">Sign in</button></form>
<p class="auth-note">New to FitZone? <a href="{{ url_for('register') }}">Create an account</a></p></section>{% endblock %}
